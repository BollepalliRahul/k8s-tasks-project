services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tasks_user
      POSTGRES_PASSWORD: plaintext-password
      POSTGRES_DB: tasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks_user -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks_user
      POSTGRES_PASSWORD: plaintext-password
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: